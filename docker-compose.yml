services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmms
      POSTGRES_PASSWORD: mmms
      POSTGRES_DB: mmms
    ports:
      - "5432:5432"
    volumes:
      - mmms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmms -d mmms"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mmms:mmms@db:5432/mmms
      SECRET_KEY: dev-secret-change-in-production
      REQUIRE_AUTH_WRITES: "true"
      PUBLIC_APP_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ""
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  mmms_pgdata:
  web_node_modules:
